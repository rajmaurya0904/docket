[project]
name = "docket"
version = "0.1.0"
description = "A zero-dependency static documentation site generator that turns Markdown into a navigable site with interactive API explorers."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
readme = "README.md"

[project.scripts]
docket = "docket.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docket*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
